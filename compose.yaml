services:
  postgres:
    image: postgres:17-alpine
    container_name: one-invoice-postgres
    environment:
      POSTGRES_DB: one_invoice
      POSTGRES_USER: one_invoice
      POSTGRES_PASSWORD: one_invoice_dev
    ports:
      - "55432:5432"
    volumes:
      - one_invoice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one_invoice -d one_invoice"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  one_invoice_pgdata:
